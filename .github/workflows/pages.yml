name: Deploy Pages (main + dev)

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: site-dev
        continue-on-error: true

      - name: Assemble combined site
        run: |
          mkdir -p _site
          cp -r site-main/. _site/
          rm -rf _site/.git _site/.github
          if [ -d site-dev ]; then
            mkdir -p _site/dev
            cp -r site-dev/. _site/dev/
            rm -rf _site/dev/.git _site/dev/.github
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
